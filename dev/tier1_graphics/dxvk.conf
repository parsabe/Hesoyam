# DXVK Configuration Optimized for NVIDIA GeForce RTX 4060 Mobile & GTA: San Andreas
# Enables maximum GPU utilization, Vulkan pipeline caching, and high frame rates.

# Framerate Limiter: 0 disables the cap; can be set to 120, 144, 165, or 240
d3d9.maxFrameRate = 0

# Anisotropic Filtering: Force 16x for pristine texture filtering across long draw distances
d3d9.samplerAnisotropy = 16

# Latency and Presentation:
# 0 = Uncapped VSync (lowest input lag), 1 = Standard VSync
dxgi.syncInterval = 0
d3d9.presentInterval = 0

# Surface and Memory Management:
# Defer surface creation to prevent render pipeline stalls on high-refresh displays
d3d9.deferSurfaceCreation = True

# Disable software vertex processing emulation - route directly to RTX 4060 hardware
d3d9.allowDiscard = True

# Asynchronous shader compilation & Vulkan pipeline caching
dxvk.enableAsync = True
dxvk.numCompilerThreads = 14

# Memory Allocation:
# Maximize VRAM allocation budget from the 8GB GDDR6 on RTX 4060
dxvk.maxChunkSize = 256
